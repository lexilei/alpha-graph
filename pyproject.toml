[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alpha-graph"
version = "0.1.0"
description = "Financial knowledge graph and multi-agent LLM pipeline for quantitative trading signals"
requires-python = ">=3.10"
dependencies = [
    "alpaca-py>=0.30",
    "edgartools>=3.0",
    "finnhub-python>=2.4",
    "openai>=1.0",
    "langchain>=0.3",
    "langgraph>=0.2",
    "scikit-learn>=1.4",
    "hmmlearn>=0.3",
    "lightgbm>=4.0",
    "scipy>=1.11",
    "pandas>=2.1",
    "numpy>=1.26",
    "yfinance>=0.2",
    "quantstats>=0.0.62",
    "networkx>=3.2",
    "torch>=2.1",
    "torch-geometric>=2.4",
    "tiktoken>=0.5",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
    "loguru>=0.7",
    "pysentiment2>=0.1",          # factor 12: Loughran-McDonald lexicon
    "sentence-transformers>=3.0", # factors 11/13: 10-K embedding similarity
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.3",
    "ipykernel>=6.27",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
