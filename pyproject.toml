[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alpha-graph"
version = "0.1.0"
description = "SEC filing text factors on an S&P 500 panel"
requires-python = ">=3.10"
dependencies = [
    "edgartools>=3.0",
    "scikit-learn>=1.4",
    "lightgbm>=4.0",
    "scipy>=1.11",
    "pandas>=2.1",
    "numpy>=1.26",
    "yfinance>=0.2",
    "torch>=2.1",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
    "loguru>=0.7",
    "pysentiment2>=0.1",
    "sentence-transformers>=3.0",
    "networkx>=3.0",
    "openai>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.3",
    "ipykernel>=6.27",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
